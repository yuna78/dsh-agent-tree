<!doctype html>
<!--
  dsh-plugin-agent-tree · 桌面壳渲染页

  和 client.js（页内卡片）共用同一套 MiniInner 渲染与皮肤，所以桌面上的卡片长得一模一样。
  页面零网络：
    - 状态由原生壳（dock.swift）轮询宿主后注入 window.__dockState()；
    - 点击 / 拖动 / 布局经 webkit.messageHandlers.dock 回传原生层；
    - React 为 vendor/ 里的本地 UMD 构建（见 vendor/README.md）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Agent Tree Dock</title>
<link rel="stylesheet" href="./dock.css">
</head>
<body>
<div id="dock-status">等待 DSH 页面连接…</div>
<div id="mount"></div>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script>
  // 桌面壳标记：client.js 的「发布器」看到它就停手（壳自己不要再把数据发回宿主）。
  window.__DSH_AGENT_TREE_DOCK__ = true;
  // client.js 平时由 DSH 的 __ModuleLoader__ 加载；这里提供一个最小实现，
  // 工厂只需要 require('react')。
  window.__ModuleLoader__ = {
    load({ id, factory }) {
      window.__DSH_AGENT_TREE_CLIENT__ = factory((name) => {
        if (name === 'react') return window.React;
        throw new Error('unexpected require(' + name + ')');
      });
      window.__DSH_AGENT_TREE_CLIENT__.id = id;
    },
  };
</script>
<script src="./client.js"></script>
<script src="./dock.js"></script>
</body>
</html>
